[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/your-app/artisan queue:work --sleep=3 --tries=3 --timeout=90 --queue=default
autostart=true
autorestart=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/html/your-app/storage/logs/worker.log
stopwaitsecs=3600
